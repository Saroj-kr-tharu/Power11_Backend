services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"  # RedisInsight UI port
    environment:
      - RI_ACCEPT_EULA=yes
    depends_on:
      - redis
    volumes:
      - redisinsight-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
   

volumes:
  redisinsight-data:
